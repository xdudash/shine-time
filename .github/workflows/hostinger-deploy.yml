name: Production Hostinger Deploy

on:
  workflow_run:
    workflows: ["Verify cleaning platform"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Validate production configuration
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USER HOSTINGER_SSH_KEY HOSTINGER_KNOWN_HOSTS HOSTINGER_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
          done
          case "$HOSTINGER_PATH" in
            /*) ;;
            *) echo 'HOSTINGER_PATH must be an absolute path'; exit 1 ;;
          esac

      - name: Prepare SSH
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build Hostinger package
        run: |
          set -euo pipefail
          python scripts/package-frontend.py
          test -s artifacts/shine-time-frontend.zip
          test -s artifacts/frontend-checksums.json

      - name: Upload release package
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          release="/tmp/shine-time-${{ github.event.workflow_run.head_sha }}.zip"
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes artifacts/shine-time-frontend.zip "$HOSTINGER_USER@$HOSTINGER_HOST:$release"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$HOSTINGER_USER@$HOSTINGER_HOST" "mkdir -p '$HOSTINGER_PATH' && unzip -oq '$release' -d '$HOSTINGER_PATH' && rm -f '$release'"

      - name: Verify remote release marker
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$HOSTINGER_USER@$HOSTINGER_HOST" "test -s '$HOSTINGER_PATH/index.php' && test -s '$HOSTINGER_PATH/config/supabase.php' && test -s '$HOSTINGER_PATH/assets/app.js'"
